services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitadrive
      POSTGRES_PASSWORD: vitadrive
      POSTGRES_DB: vitadrive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitadrive -d vitadrive"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vitadrive:vitadrive@db:5432/vitadrive
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      VITADRIVE_RATE_LIMITS: ${VITADRIVE_RATE_LIMITS:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
