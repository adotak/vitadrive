[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitadrive"
version = "0.1.0"
description = "Vehicle vitals monitoring, threshold alerts, predictive maintenance and service records for modern cars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyjwt[crypto]>=2.8",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
]

[project.optional-dependencies]
obd = ["obd>=0.7.1"]
train = ["torch>=2.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
vitadrive = "vitadrive.cli:main"

[tool.setuptools.packages.find]
include = ["vitadrive*"]

[tool.setuptools.package-data]
vitadrive = ["anomaly_model.json", "static/*", "static/img/*", "static/media/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
