[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitadrive"
version = "1.0.1"
description = "Vehicle vitals monitoring, threshold alerts, predictive maintenance and service records for modern cars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt[crypto]>=2.8",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pywebpush>=2.0",
    "sentry-sdk>=2",
]

[project.optional-dependencies]
obd = ["obd>=0.7.1"]
train = ["torch>=2.2"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
    "pip-audit>=2.8",
    "mypy>=1.10",
    "pytest-cov>=5",
    "pre-commit>=3.7",
    "PyYAML>=6.0",
    "tomli; python_version<'3.11'",
]
e2e = [
    "playwright>=1.45",
    "pytest-playwright>=0.5",
]

[project.scripts]
vitadrive = "vitadrive.cli:main"

[tool.setuptools.packages.find]
include = ["vitadrive*"]

[tool.setuptools.package-data]
vitadrive = ["anomaly_model.json", "static/*", "static/img/*", "static/media/*", "static/fonts/*",
             "static/js/*", "migrations/*.mako", "migrations/versions/*.py"]

[tool.ruff]
line-length = 120
extend-include = ["e2e/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = ["vitadrive", "app.py"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["pywebpush"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["vitadrive"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
